# Render blueprint for the API. Point Render at this repository and it reads this file.
#
# The free plan has no persistent disk, so the pipelines run in the build and their outputs
# travel in the image: the API serves the record it was built with. Rebuild to refresh it.
services:
  - type: web
    name: joto-guard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: >-
      sh -c "python -m conduit_sentinel data/raw/organiser --out data/processed
      && python -m joto_guard wbgt
      && python -m joto_guard forecast
      && uvicorn api.app:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /
    envVars:
      - key: JOTO_ALLOWED_ORIGINS
        sync: false      # set this to the deployed web address once Vercel gives you one
