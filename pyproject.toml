[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit-app"
version = "0.1.0"
description = "Hack The Weather 2026 entry built on the Conduit@Empathy1 weather station"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
bot = [
    "python-telegram-bot>=21",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
conduit-sentinel = "conduit_sentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bot"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unit symbols such as × and ° are intended

[tool.ruff.lint.isort]
known-first-party = ["api", "conduit_sentinel", "joto_bot", "joto_guard"]
